<!DOCTYPE html>
<html lang="en">

<head>
{% include head.html %}
</head>

<body id="page-top">
    <!-- Masthead-->
    <header class="masthead">
        <div class="container px-4 px-lg-5 h-100" style="position: relative;">
            {% include navbar.html %}
            <div class="row gx-4 gx-lg-5 h-100 align-items-end justify-content-center text-center">
                <div class="col-12 col-lg-8 hero-content">
                    <h1 class="text-white font-weight-bold" style="font-family: var(--font-serif); text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);">{{ site.tagline }}</h1>
                    <hr class="divider divider-light" />
                    <p class="text-white-85 mb-4" style="text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);">STEM education for our local elementary schools.</p>
                    <a class="btn btn-primary btn-xl" href="#getinvolved">Sign Up</a>
                </div>
            </div>
        </div>
        <div class="bottom">
            <a class="scroll-indicator" href="#mission"></a>
        </div>
    </header>

    {{ content }}

    {% include footer.html %}
    {% include scripts.html theme_js="scripts.js" vectorfield=true %}
</body>

</html>

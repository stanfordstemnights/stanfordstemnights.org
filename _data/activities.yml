- id: fingerprint
  card_title: Giant Fingerprint
  modal_title: Giant Fingerprints
  image: /static/assets/activities/giantfingerprint.png
  body: |
    Materials:
    <ul>
      <li>Balloon</li>
      <li>Ink pad</li>
    </ul>
    <p>Instructions:</p>
    <ul>
      <li>Stretch your balloon several times so it is easy to blowup. </li>
      <li>Lay the balloon on the table and flatten an area big enough to fit a fingerprint making sure there are no creases in the balloon.</li>
      <li>Press your finger into the ink.</li>
      <li>Now press your inked finger onto the balloon.</li>
      <li>Gently roll your finger to capture your entire fingerprint.</li>
      <li>Blow up the balloon and tie it off.</li>
      <li>Enjoy inspecting your Giant Fingerprint.</li>
      <li>By enlarging a fingerprint on the balloon, participants can observe distinct patterns like arches, loops, and whorls. These patterns are unique to every person, making fingerprints a powerful tool for identifying people in criminal investigations. </li>
    </ul>

- id: lavalamp
  card_title: Lava Lamp in a Bottle
  modal_title: Lava Lamp Bottle
  image: /static/assets/activities/lavalamp.png
  body: |
    Materials:
    <ul>
      <li>Clear plastic bottle with cap</li>
      <li>Water</li>
      <li>Vegetable oil</li>
      <li>Food coloring</li>
      <li>Effervescent tablets (like Alka-Seltzer)</li>
    </ul>
    <p>Instructions:</p>
    <p>Fill the bottle about 1/4 full with water.</p>
    <p>Add a few drops of food coloring to the water.</p>
    <p>Fill almost the rest of the bottle with vegetable oil and watch the oil/water separate.</p>
    <p>Break an effervescent tablet into 4 pieces.</p>
    <p>Drop one piece into the bottle and watch what happens.</p>
    <p>Add more pieces one at a time to keep the reaction going.</p>

- id: marshmallow
  card_title: Marshmallow and Spaghetti Towers
  modal_title: Marshmalllow Spaghetti Structures
  image: /static/assets/activities/marshmallow.png
  body: |
    Materials:
    <ul>
      <li>Uncooked spaghetti (20–30 pieces)</li>
      <li>Mini marshmallows (20–30 pieces)</li>
      <li>Scissors (optional, for breaking spaghetti)</li>
      <li>Ruler (optional, for measuring tower height)</li>
      <li>Tape measure (optional, for final height assessment)</li>
    </ul>
    <p>
      Plan Your Design
      Before building, sketch a blueprint of your tower. Consider using triangles for stability.
      Decide how to balance height and strength using the available materials.
      Create a Base
      Use marshmallows as connectors and spaghetti as beams.
      Construct a strong, wide base to support the structure. A square or triangular base works best.
      Build Upward
      Add vertical supports by connecting spaghetti to the base using marshmallows.
      Reinforce joints with extra marshmallows to prevent weak points.
      Use diagonal bracing to improve stability.
      Maximize Height While Maintaining Stability
      As the tower gets taller, check if it leans or collapses.
      If unstable, add additional supports or modify the structure.
      The team with the tallest structure wins!
      Final Touch: Add a Marshmallow on Top
      Carefully place a single marshmallow at the highest point.
      Measure the final height of the tower.
      Test and Improve
      If the tower collapses, analyze weak points and redesign as needed.
      Work as a team to fix the design!
    </p>

- id: cabbage
  card_title: The Science of Cabbage Juice
  modal_title: Science of Cabbage Juice
  image: /static/assets/activities/cabbage.png
  body: |
    Materials:
    <ul>
      <li> Small red cabbage </li>
      <li> Knife for chopping cabbage </li>
      <li> Pot for boiling water </li>
      <li> Strainer </li>
      <li> Glass jar with lid </li>
      <li> Ice cube tray (optional) </li>
    </ul>
    Instructions for Red Cabbage Juice:
    <p>
      Chop the red cabbage into small pieces using a knife. Be sure to provide adult supervision if children are doing the chopping.
      Place the chopped cabbage in a pot and cover the cabbage with water.
      Heat the cabbage and water mixture until the water boils, stirring occasionally.
      Once boiling, remove the pot from the heat source and allow the cabbage water mixture to cool for 30 minutes.
      After the cabbage water mixture has cooled, strain the solid cabbage from the liquid. The remaining liquid should be a deep purple color.
      Pour the cabbage juice into a glass container, seal it, and store it in the refrigerator until ready to use.
      Alternatively, pour the cabbage juice into ice cube trays and freeze. (will prep cabbage juice before STEM Night)
    </p>

- id: lemonsoda
  card_title: Lemon Soda
  modal_title: Lemon Soda
  image: /static/assets/activities/lemon-soda.jpg
  body: |
    Materials (per kid):
    <ul>
      <li>2 plastic cups</li>
      <li>Water</li>
      <li>Lemonade powder</li>
      <li>Lemon juice</li>
      <li>⅛ tsp baking soda</li>
      <li>Spoon</li>
      <li>Measuring cups and spoons</li>
      <li>Knife</li>
    </ul>
    <p>Instructions:</p>
    <p>In one cup, mix together 1 cup of water with 1 spoon of lemonade powder.</p>
    <p>Cut the lemon into 8ths.</p>
    <p>Add around a teaspoon of lemon juice to the lemonade.</p>
    <p>Add ⅛ tsp baking soda (half of ¼ teaspoon) and mix.</p>
    <p>Taste your lemon soda!</p>
    <p>Explanation:</p>
    <p>Just like in the lemon volcano demo, an acid-base reaction occurs and the citric acid from the lemon juice
      and the basic baking soda work together to create a gas (the same gas, in fact, as in carbon
      dioxide!).
      Because this reaction takes place in the juice, some of this carbon dioxide gets trapped within
      the liquid.
      This is what makes the soda taste fizzy.
      You may notice that your drink tastes a bit salty; this is because baking soda has sodium in it
      – does
      anybody know what sodium chloride is? It’s table salt.</p>

- id: balloon
  card_title: Yeast Balloon
  modal_title: Blow Up a Balloon With Yeast
  image: /static/assets/activities/balloon.jpg
  body: |
    <p>Note: It will take some time to inflate the balloon. Have the kids come back later.</p>
    <p>Materials</p>
    <ul>
      <li>A packet of yeast (available in the grocery store)</li>
      <li>A small, clean, clear, plastic soda bottle (16 oz. or smaller)</li>
      <li>1 teaspoon of sugar</li>
      <li>Some warm water (MUST BE WARM)</li>
      <li>A small balloon</li>
      <li>Electric kettle</li>
    </ul>
    <p>Instructions:</p>
    <p>Fill the bottle up with about one inch of warm water. (When yeast is cold or dry the micro
      organisms are
      resting.)</p>
    <p>Add all of the yeast packet and gently swirl the bottle a few seconds. (As the yeast dissolves,
      it becomes
      active – it comes to life! Don’t bother looking for movement, yeast is a microscopic fungus
      organism.)</p>
    <p>Add the sugar and swirl it around some more. Like people, yeast needs energy (food) to be active,
      so we
      will give it sugar. Now the yeast is “eating!”</p>
    <p>Blow up the balloon a few times to stretch it out then place the neck of the balloon over the
      neck of the
      bottle.</p>
    <p>Let the bottle sit in a warm place for about 20 minutes</p>
    <p>If all goes well the balloon will begin to inflate!</p>
    <p>Explanation:</p>
    <p>As the yeast eats the sugar, it releases a gas called carbon dioxide as a waste product. The gas
      fills the
      bottle and then fills the balloon as more gas is created. We all know that there are “holes” in
      bread, but
      how are they made? The answer sounds a little like the plot of a horror movie. Most breads are
      made using
      YEAST. Believe it or not, yeast is actually living microorganisms! When bread is made, the yeast
      becomes
      spread out in flour. Each bit of yeast makes tiny gas bubbles and that puts millions of bubbles
      (holes) in
      our bread before it gets baked. Naturalist’s note – The yeast used in this experiment are the
      related
      species and strains of Saccharomyces cervisiae. (I’m sure you were wondering about that.)
      Anyway, when the
      bread gets baked in the oven, the yeast dies and leaves all those bubbles (holes) in the bread.
      Yum.</p>

- id: whirlybirds
  card_title: Whirlybirds
  modal_title: Whirlybirds
  image: /static/assets/activities/whirlybird.jpg
  body: |
    <p>Notes: The kids need to throw the whirlybirds VERY high into the air – encourage them to
      throw it as hard as possible. You can also keep the wings folded down and throw it up. It
      will still fly. If you can access the second/third story of a building it’s fun to drop the
      whirlybirds from there and watch them spin to the ground.</p>
    <p>Materials:</p>
    <ul>
      <li>Paper clips</li>
      <li>Paper with template: <a href="https://www.sciencebuddies.org/Files/15270/9/whirlybird-template-new.pdf">https://www.sciencebuddies.org/Files/15270/9/whirlybird-template-new.pdf</a>
      </li>
      <li>Regular paper</li>
      <li>Scissors</li>
    </ul>
    <p>Instructions</p>
    <p>Cut out and fold the whirlybird according to the template.</p>
    <p>First toss the whirlybird up without anything weighing it down.</p>
    <p>Then add a paper clip to the bottom – notice the difference?</p>
    <p>Experiment with different paper clip weights, lengths/widths of the propeller wings, etc.
      Have a little competition to see who can make the best design that flies the longest!</p>
    <p>Explanation:</p>
    <p>Helicopters stay in the air using spinning blades that are used to generate an upwards push
      called "lift." With enough of it, a craft can overcome the force of gravity, which pulls the
      object down toward Earth. Aircrafts such as helicopters with spinning blades are called
      rotary wing, unlike traditional airplanes, which are fixed wing.</p>
    <p>How do helicopters fly? (cont)</p>
    <p>Helicopters’ rotors push air down, creating a difference in air pressure that creates lift.
      The faster the rotors spin, the greater the difference in air pressure. The greater the
      difference in air pressure, the more the lift, and the higher the helicopter can fly. </p>
    <p>How do our whirlybirds work? </p>
    <p>Just like a helicopter, our whirlybirds rely on lift. This lift is generated from the
      difference in pressure between the air below the rotors of the helicopter and the air above
      the helicopter rotors. Our whirlybirds don’t have enough lift to overcome gravity. However,
      they do have enough lift to slow their descent towards the ground. </p>

- id: oobleck
  card_title: Oobleck
  modal_title: Oobleck
  image: /static/assets/activities/oobleck.jpg
  body: |
    <p>Description:  In this activity, students will learn about non-Newtonian fluids and viscosity.</p>
    <p>Materials:</p>
    <ul>
      <li>Cornstarch</li>
      <li>Water</li>
      <li>Cup</li>
      <li>Spoon</li>
    </ul>
    <p>Directions</p>
    <p>Pour about one cup of cornstarch into the mixing bowl, and dip your hands into it.</p>
    <p>Pour the water in, mixing slowly as you go. Keep adding more water until the mixture becomes thick (and hardens when you tap on it). Add more cornstarch if it gets too runny, and more water if it becomes too thick.</p>
    <p>Drop your hands quickly into the Oobleck - take note of what happens slowly lower your hands into it. Notice the difference!</p>
    <p>Hold a handful in your open palm—what happens?</p>
    <p>Try squeezing it in your fist or rolling it between your hands—how does it behave differently?</p>
    <p>Move your fingers through the mixture slowly, then try moving them faster.</p>
    <p>Explanation:</p>
    <p>Oobleck can mimic the qualities of a solid or liquid. These materials are called Non-newtonian fluids. While a Newtonian fluid has a constant viscosity (example: water has a constant viscosity), the viscosity of Non-newtonian fluids changes. You can think of viscosity as fluidity, or how thick a fluid is. For example, syrup has a high viscosity while water has a lower viscosity.</p>
    <p>Can you think of more examples of high viscosity fluids? What about low viscosity fluids?</p>
    <p>Back to oobleck.  The viscosity of oobleck changes depending on the force exerted on it over time.  Strong forces exerted over little time cause the oobleck to have a high viscosity.  This is because the cornstarch particles are being governed by the forces of friction, which make it hard for them to move against each other.  This in turn increases the viscosity.  However, when weaker forces are exerted on the oobleck, it acts more like a liquid.</p>

- id: chromaflowers
  card_title: Chromatography Flowers
  modal_title: Chromatography Flowers
  image: /static/assets/activities/chromaflowers.jpg
  body: |
    <p>Description:  In this activity, students will learn about chromatography and how it is used to separate mixtures of substances into their components based on small differences in solubility of different molecules.</p>
    <p>Materials:</p>
    <ul>
      <li>White Coffee Filters</li>
      <li>Pencils OR Pens</li>
      <li>Scissors</li>
      <li>Water Based Markers</li>
      <li>Tape</li>
      <li>Cup</li>
      <li>Water</li>
      <li>Towels OR Paper Towels</li>
    </ul>
    <p>Directions:</p>
    <p>Open the coffee filter and make a design as desired with markers.  Make sure the marker ink bleeds through the coffee filter.</p>
    <p>Fill the Cup With Just Enough Water to Submerge the Bottom Center of the Filter.</p>
    <p>Place the Decorated Filter Into the Cup With the Middle Touching the Water.</p>
    <p>Watch the Water Move Upwards.  Wait for around 5 minutes.</p>
    <p>Take your chromatography flower out of the cup and let it dry.</p>
    <p>Fold the filter into fourths and cut off the top to make a petal design.</p>
    <p>Explanation:</p>
    <p>Chromatography is used to separate mixtures of substances into their components based on small differences in solubility of different molecules.  Molecules that are the most soluble will move the furthest and the least soluble will travel the shortest and are measured in retention time. The water itself is able to move up the paper due to the properties of water creating capillary action.</p>
    <p>Determining the components of a mixture are important because it allows scientists to know what is in a mixture and how to recreate it (such as in medicine if a new mixture is found in nature) or how to alter it (such as if a mixture is toxic to people, chromatography can help determine what is making it toxic).</p>
